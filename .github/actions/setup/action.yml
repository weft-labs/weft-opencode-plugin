name: Setup Node and pnpm
description: Install the pinned Node and pnpm toolchain and frozen dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10.33.4
    - uses: actions/setup-node@v7
      with:
        node-version: "24"
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
